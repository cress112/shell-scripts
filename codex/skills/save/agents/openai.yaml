interface:
  display_name: "Save"
  short_description: "Save work history to SQLite memory"
  default_prompt: "Use $save to resolve the target project path and save compact memory with ~/.codex/scripts/codex-memory add into ~/.codex/sqlite/user-memory.sqlite. Set status/permanence metadata so optimize-memory can delete completed ephemeral entries and preserve permanent decisions. Do not create or update Markdown memory files."
